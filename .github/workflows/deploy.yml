# Continuous non-breaking MVP ship → Vercel (preview/test then prod).
# PR path: CI only. Merge/push to main → CI green → this workflow.
name: Deploy — continuous MVP ship

on:
  workflow_run:
    workflows: ["CI — no breaking changes"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Re-run Hold/clamp/schema gates on the exact CI SHA (never skip).
  gates:
    name: autoroute + static gates
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/autoroute-adk/requirements.txt

      - name: Install autoroute package deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/autoroute-adk/requirements.txt

      - name: Assert vol_hard_max=100 (drift gate)
        run: |
          PYTHONPATH=services/autoroute-adk python - <<'PY'
          from iot_asp_autoroute.clamps import CLAMPS, SCHEMA_VERSION, validate_patch
          assert SCHEMA_VERSION == 1, SCHEMA_VERSION
          assert CLAMPS["vol_hard_max"] == 100.0, CLAMPS
          assert CLAMPS["vol_soft_max"] == 100.0, CLAMPS
          ok50, _, c50 = validate_patch({"algo": "hop", "vol": 50, "fMin": 17000, "fMax": 23000})
          assert ok50 and c50["vol"] == 50.0, c50
          ok_lin, _, c_lin = validate_patch({"algo": "hop", "vol": 0.5, "fMin": 17000, "fMax": 23000})
          assert ok_lin and c_lin["vol"] == 50.0, c_lin
          ok_hi, msg_hi, _ = validate_patch({"algo": "hop", "vol": 101, "fMin": 17000, "fMax": 23000})
          assert not ok_hi and "hard max" in msg_hi, msg_hi
          print("vol_hard_max drift gate OK")
          PY

      - name: Run scripts/autoroute_dev.sh
        run: bash scripts/autoroute_dev.sh

      - name: Static gates (Hold/Manual, no keys, schemaVersion)
        run: bash scripts/ci_static_gates.sh

  deploy:
    name: Vercel preview then prod
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Vercel GitHub secrets
        id: vercel_secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VERCEL_TOKEN:-}" ] || missing+=("VERCEL_TOKEN")
          [ -n "${VERCEL_ORG_ID:-}" ] || missing+=("VERCEL_ORG_ID")
          [ -n "${VERCEL_PROJECT_ID:-}" ] || missing+=("VERCEL_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Auto-deploy skipped — missing GitHub secrets: ${missing[*]}. See docs/ci.md (Continuous ship). Manual path: vercel --prod from hop-ultrasonic (or linked project)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Vercel secrets present — proceeding with preview then prod."

      - name: Deploy Vercel preview (test)
        if: steps.vercel_secrets.outputs.ready == 'true'
        id: preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Pin CLI (matches local Studio pin family); do not use @latest.
          PREVIEW_URL="$(npx --yes vercel@48.4.1 deploy --yes --token="$VERCEL_TOKEN")"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "Preview/test URL: ${PREVIEW_URL}"

      - name: Deploy Vercel production
        if: steps.vercel_secrets.outputs.ready == 'true'
        id: prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PROD_URL="$(npx --yes vercel@48.4.1 deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "prod_url=${PROD_URL}" >> "$GITHUB_OUTPUT"
          echo "Production URL: ${PROD_URL}"
          echo "Alias (stable): https://hop-ultrasonic.vercel.app/"

      - name: Skip summary
        if: steps.vercel_secrets.outputs.ready != 'true'
        run: |
          echo "Deploy job completed without Vercel promote (secrets not configured)."
          echo "Required repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
          echo "Documented in docs/ci.md — manual: vercel --prod"
