name: MVP closed-log append
# Append closed MVP issues to docs/mvp-closed-log.md
#
# Opens/updates PR branch automation/mvp-closed-log (works under main-protection
# with empty bypass_actors). Optional direct main push: repo variable
# MVP_CLOSED_LOG_PUSH_MAIN=1 when Actions has a bypass.
# Related: docs/mvp-roadmap.md, issue #65.
# Security: never interpolate issue title/body into run: scripts via ${{ }}.
# Pass only issue number through expressions; fetch title/outcome via gh + env.

name: MVP closed-issue log

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to append (optional; defaults to event issue)"
        required: false

# Default GITHUB_TOKEN often has contents: read. Rulesets may block direct push to main.
# This job runs the CLI append and attempts a commit only when write is available;
# otherwise it posts a soft notice and exits 0 so the issue close is never blocked.
permissions:
  contents: write
  issues: read
        description: Issue number to append (backfill)
        required: true
      outcome:
        description: One-line outcome
        default: closed
  pull-requests: write
concurrency:
  group: mvp-closed-log
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append closed issue to log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          N="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          if [[ -z "${N}" ]]; then
            echo "No issue number; skipping"
            exit 0
          fi
          chmod +x scripts/mvp_closed_log_append.sh
          bash scripts/mvp_closed_log_append.sh "$N" || true
      - name: Commit log if changed
        id: commit
        continue-on-error: true
          if git diff --quiet -- docs/mvp-closed-log.md; then
            echo "No log change"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mvp-closed-log.md
          git commit -m "docs: append closed issue #${{ github.event.issue.number || github.event.inputs.issue_number }} to MVP log"
          # Prefer automation branch if main is protected; soft-fail on push denial.
          if [[ "${MVP_CLOSED_LOG_PUSH_MAIN:-0}" == "1" ]]; then
            git push origin HEAD:main || echo "NOTICE: push to main blocked (ruleset/contents). Run scripts/mvp_closed_log_append.sh locally or open a PR."
          else
            BRANCH="automation/mvp-closed-log"
            git push -u origin "HEAD:${BRANCH}" || echo "NOTICE: could not push ${BRANCH}; manual CLI path documented in docs/mvp-closed-log.md"
      - name: Resolve issue number
        id: num
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_FROM_EVENT: ${{ github.event.issue.number }}
          ISSUE_FROM_INPUT: ${{ inputs.issue_number }}
          if [ "$EVENT_NAME" = "issues" ]; then
            N="$ISSUE_FROM_EVENT"
            N="$ISSUE_FROM_INPUT"
          case "$N" in
            ''|*[!0-9]*) echo "invalid issue number: [$N]" >&2; exit 1 ;;
          esac
          echo "n=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Append log line (idempotent)
        id: write
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.num.outputs.n }}
          INPUT_OUTCOME: ${{ inputs.outcome }}
          REPO: ${{ github.repository }}
          LOG=docs/mvp-closed-log.md
          test -f "$LOG"
          if grep -F "| #${N} |" "$LOG" >/dev/null 2>&1; then
            echo "already_logged=true" >> "$GITHUB_OUTPUT"
            echo "Issue #${N} already in log; skip"
          TITLE="$(gh issue view "$N" -R "$REPO" --json title --jq .title)"
            # Closing-associated comment from timeline (not latest comment page).
            # Prefer last ISSUE_COMMENT at/before CLOSED_EVENT; else title fallback.
            OUTCOME="$(gh api graphql -f query='
              query($owner:String!,$name:String!,$n:Int!) {
                repository(owner:$owner, name:$name) {
                  issue(number:$n) {
                    title
                    timelineItems(last: 100, itemTypes: [CLOSED_EVENT, ISSUE_COMMENT]) {
                      nodes {
                        __typename
                        ... on IssueComment { body createdAt }
                        ... on ClosedEvent { createdAt }
                      }
                    }
                  }
                }
              }' -f owner="${REPO%/*}" -f name="${REPO#*/}" -F n="$N" --jq '
                .data.repository.issue as $i
                | ($i.timelineItems.nodes
                    | map(select(.__typename == "ClosedEvent"))
                    | last
                    | .createdAt) as $closed
                | if $closed == null then empty
                  else
                    ($i.timelineItems.nodes
                      | map(select(.__typename == "IssueComment" and .createdAt <= $closed and ((.body // "") | length) > 0))
                      | last
                      | .body // empty)
                  end
              ')"
            OUTCOME="$(printf '%s' "$OUTCOME" | head -n 1)"
            if [ -z "$OUTCOME" ]; then
              OUTCOME="$TITLE"
            fi
            OUTCOME="${INPUT_OUTCOME:-closed}"
          # Sanitize for single-line pipe-delimited log (untrusted text)
          TITLE="$(printf '%s' "$TITLE" | tr '|\n\r' ' /  ' | sed 's/  */ /g' | cut -c1-160)"
          OUTCOME="$(printf '%s' "$OUTCOME" | tr '|\n\r' ' /  ' | sed 's/  */ /g' | cut -c1-200)"
          DAY="$(date -u +%Y-%m-%d)"
          LINE="${DAY} | #${N} | ${TITLE} | ${OUTCOME}"
          printf '%s\n' "$LINE" >> "$LOG"
          {
            echo "already_logged=false"
            echo "line<<EOF"
            echo "$LINE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Appended: $LINE"
      - name: Commit via PR branch
        if: steps.write.outputs.already_logged != 'true'
          LINE: ${{ steps.write.outputs.line }}
          PUSH_MAIN: ${{ vars.MVP_CLOSED_LOG_PUSH_MAIN || '0' }}
          BRANCH="automation/mvp-closed-log"
          git fetch origin main
          # Preserve unmerged rows: reuse remote automation branch, then merge main.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/${BRANCH}"
            git merge --no-edit origin/main
            git checkout -B "$BRANCH" origin/main
          if ! grep -F "| #${N} |" "$LOG" >/dev/null 2>&1; then
            printf '%s\n' "$LINE" >> "$LOG"
          git add "$LOG"
          if git diff --cached --quiet; then
            echo "nothing to commit"
          git commit -m "chore: log closed issue #${N}" -m "Refs #65"
          if [ "$PUSH_MAIN" = "1" ]; then
            git push origin "HEAD:main" && exit 0
          # Fast-forward from remote tip after merge — no force-push of a recreated tip.
          git push -u origin "$BRANCH"
          if gh pr view "$BRANCH" -R "$REPO" >/dev/null 2>&1; then
            echo "PR for ${BRANCH} already open"
            gh pr create -R "$REPO" \
              --base main \
              --head "$BRANCH" \
              --title "chore: mvp closed-log (#${N})" \
              --body "## Summary
          - Append closed issue #${N} to `docs/mvp-closed-log.md`
          - Automation for #65 (no new secrets)
          ## Test plan
          - [ ] Diff is a single append-only log line
          - [ ] No secrets in the line
          Tracks #65."
          fi
