# Docs analyzer — inventory + broken links + readability signals (stdlib).
# Day one: fail on broken relative links only. See docs/README.md § Contributing.
name: Docs analyzer

on:
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - "scripts/docs_analyzer.py"
      - ".github/workflows/docs-analyzer.yml"
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

concurrency:
  group: docs-analyzer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: docs analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run docs analyzer (fail on broken links)
        env:
          DOCS_ANALYZER_FAIL_ON: broken_links
          DOCS_ANALYZER_LINE_THRESHOLD: "400"
          DOCS_ANALYZER_PARA_WORDS: "120"
        run: python3 scripts/docs_analyzer.py | tee docs-analyzer-report.txt

      - name: PR comment summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- docs-analyzer -->';
            let body = marker + '\n## Docs analyzer\n\n';
            try {
              const report = fs.readFileSync('docs-analyzer-report.txt', 'utf8');
              const summary = report.split('### Summary')[1] || report.slice(-800);
              body += '```\n' + summary.trim().slice(0, 3500) + '\n```\n';
              body += '\n_Fail rule: broken relative links. Orphans / size / TL;DR / long paragraphs are warnings._\n';
            } catch (e) {
              body += '_Report file missing._\n';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
